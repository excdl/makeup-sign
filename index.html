<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企業級簽核系統 2.0</title>

<style>

body{
    margin:0;
    font-family:"Microsoft JhengHei";
    background:#f4f6f9;
}

/* ============ Layout ============ */

.app{
    display:flex;
    height:100vh;
}

/* ============ Sidebar ============ */

.sidebar{
    width:220px;
    background:#1f2937;
    color:white;
    padding:20px;
}

.sidebar .logo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}

.sidebar button{
    width:100%;
    margin:8px 0;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#374151;
    color:white;
    cursor:pointer;
}

.sidebar button:hover{
    background:#3b82f6;
}

/* ============ Main ============ */

.main{
    flex:1;
    padding:20px;
    overflow:auto;
}

/* ============ Topbar ============ */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.closeBtn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:#ef4444;
    color:white;
    cursor:pointer;
}

/* ============ Cards ============ */

.cards{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    text-align:center;
}

.card div{
    font-size:30px;
    font-weight:bold;
}

.red{ color:#ef4444; }
.orange{ color:#f59e0b; }
.green{ color:#10b981; }

/* ============ Search ============ */

.search{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:15px;
}

/* ============ Table ============ */

.tableWrap{
    background:white;
    border-radius:12px;
    overflow:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f3f4f6;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f9fafb;
    cursor:pointer;
}

/* ============ Modal ============ */

#overlay{
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.4);
}

#modal{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    border-radius:12px;
    width:400px;
}

.modalClose{
    float:right;
    border:none;
    background:red;
    color:white;
    border-radius:50%;
    width:30px;
    height:30px;
}
    </style>
</head>
<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">簽核系統 2.0</div>

        <button onclick="setStatus('ALL')">全部</button>
        <button onclick="setStatus('未簽核')">待簽核</button>
        <button onclick="setStatus('簽核中')">簽核中</button>
        <button onclick="setStatus('已簽核')">已完成</button>

    </div>

    <!-- Main -->
    <div class="main">

        <div class="topbar">
            補打卡簽核中心
            <button class="closeBtn" onclick="closeSystem()">✕</button>
        </div>

        <!-- Cards -->
        <div class="cards">

            <div class="card red">
                <div id="pendingCount">0</div>
                <span>待簽核</span>
            </div>

            <div class="card orange">
                <div id="processingCount">0</div>
                <span>簽核中</span>
            </div>

            <div class="card green">
                <div id="doneCount">0</div>
                <span>已完成</span>
            </div>

        </div>

        <!-- Search -->
        <input
            id="searchInput"
            class="search"
            placeholder="搜尋姓名..."
            oninput="renderTable()">

        <!-- Table -->
        <div class="tableWrap">
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>日期</th>
                        <th>時間</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

    </div>

</div>

<div id="overlay" onclick="closeModal()"></div>

<div id="modal">

    <button class="modalClose" onclick="closeModal()">×</button>

    <h3>簽核</h3>

    <div id="modalName"></div>
    <div id="modalDate"></div>
    <div id="modalTime"></div>

    <button onclick="submit(true)">核准</button>
    <button onclick="submit(false)">不准</button>

</div>

   
    <script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxFjQj7wFbAcG55GXNTdIWZ0xrQtMfKXSvW0bE7ujgTGO41mhd3gwfImDKoi5rIDdh/exec";

let allData = [];
let statusFilter = 'ALL';
let currentKey = null;

/* ========= Login後直接載入 ========= */

async function loadData(){

    const res = await fetch(
        `${WEB_APP_URL}?action=getLeaveData`
    ).then(r=>r.json());

    allData = res.list;

    document.getElementById('pendingCount').innerText =
        res.count['未簽核'];

    document.getElementById('processingCount').innerText =
        res.count['簽核中'];

    document.getElementById('doneCount').innerText =
        res.count['已簽核'];

    renderTable();
}

/* ========= Sidebar Filter ========= */

function setStatus(s){
    statusFilter = s;
    renderTable();
}

/* ========= Render Table ========= */

function renderTable(){

    let data = allData;

    if(statusFilter !== 'ALL'){
        data = data.filter(x => x.status === statusFilter);
    }

    const keyword =
        document.getElementById('searchInput')
        .value.toLowerCase();

    if(keyword){
        data = data.filter(x =>
            (x.userName || '').toLowerCase().includes(keyword)
        );
    }

    document.getElementById('tbody').innerHTML =
    data.map(r => `
        <tr onclick="openModal('${r.keyId}')">
            <td>${r.userName}</td>
            <td>${r.date}</td>
            <td>${r.time}</td>
            <td>${r.status}</td>
            <td>簽核</td>
        </tr>
    `).join('');
}

/* ========= Modal ========= */

function openModal(id){
    currentKey = id;
    document.getElementById('overlay').style.display='block';
    document.getElementById('modal').style.display='block';
}

function closeModal(){
    document.getElementById('overlay').style.display='none';
    document.getElementById('modal').style.display='none';
}

/* ========= Submit ========= */

async function submit(ok){

    await fetch(`${WEB_APP_URL}?action=updateLeaveApproval&keyId=${currentKey}&status=${ok?'核准':'不准'}`);

    closeModal();
    loadData();
}

/* ========= Close System ========= */

function closeSystem(){
    window.location.reload();
}

/* ========= Init ========= */

loadData();

</script>

</body>
</html>
