<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補打卡簽核系統</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

/* LOGIN */
#loginBox{
  display:flex;
  flex-direction:column;
  max-width:380px;
  margin:90px auto;
  background:#fff;
  padding:28px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}

#loginBox h2{
  text-align:center;
}

#loginBox input{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;

  /* 密碼效果 */
  -webkit-text-security: disc;
  font-size:16px;
  letter-spacing:2px;
}

#loginBox button{
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#1976d2;
  color:#fff;
  cursor:pointer;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:14px 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{
  font-weight:700;
  font-size:16px;
}

.exitBtn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:#eee;
  cursor:pointer;
}
.exitBtn:hover{
  background:#ff4d4f;
  color:#fff;
}

/* FILTER (104風格 + 數字) */
.filters{
  display:flex;
  gap:12px;
  padding:14px;
  overflow-x:auto;
}

.filters button{
  min-width:140px;
  height:52px;
  border:none;
  border-radius:30px;
  font-size:15px;
  font-weight:600;
  background:#eef2f7;
  cursor:pointer;
  transition:.2s;
  white-space:nowrap;
}

.filters button.active{
  background:#1976d2;
  color:#fff;
  box-shadow:0 4px 12px rgba(25,118,210,.25);
}

/* TABLE */
.tableBox{
  padding:0 14px 20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

th{
  background:#1976d2;
  color:#fff;
  padding:12px;
  font-size:14px;
}

td{
  padding:10px;
  text-align:center;
  border-bottom:1px solid #eee;
}

tr:hover{
  background:#f5f7fa;
  cursor:pointer;
}

/* BADGE */
.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:90px;
  height:32px;
  border-radius:16px;
  font-weight:700;
  font-size:13px;
}

.badge-未簽核{ background:#ffebee; color:#d32f2f; }
.badge-簽核中{ background:#fff3e0; color:#ef6c00; }
.badge-已簽核{ background:#e8f5e9; color:#2e7d32; }

/* MODAL */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
}

#modal{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:92%;
  max-width:520px;
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.closeBtn{
  position:absolute;
  right:10px;
  top:10px;
  width:32px;
  height:32px;
  border-radius:50%;
  border:none;
  background:#eee;
  cursor:pointer;
}
.closeBtn:hover{
  background:#ff4d4f;
  color:#fff;
}

/* modal內容置中 */
.modal-content{
  text-align:center;
  font-size:16px;
  line-height:2;
  margin-top:10px;
}

/* 按鈕（放大2倍） */
.actionBtns{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-top:25px;
}

.approveBtn,
.rejectBtn{
  width:180px;
  height:70px;
  font-size:24px;
  font-weight:700;
  border:none;
  border-radius:14px;
  cursor:pointer;
  color:#fff;
}

.approveBtn{ background:#2e7d32; }
.rejectBtn{ background:#d32f2f; }

button:disabled{
  opacity:.6;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>簽核系統登入</h2>
  <input id="code" placeholder="請輸入代碼">
  <button onclick="login()">登入</button>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

  <div class="header">
    <div class="title">補打卡簽核系統</div>
    <button class="exitBtn" onclick="logout()">×</button>
  </div>

  <!-- FILTER + COUNT -->
  <div class="filters">
    <button id="btnAll" onclick="setFilter('ALL')">全部 (0)</button>
    <button id="btn1" onclick="setFilter('未簽核')">未簽核 (0)</button>
    <button id="btn2" onclick="setFilter('簽核中')">簽核中 (0)</button>
    <button id="btn3" onclick="setFilter('已簽核')">已簽核 (0)</button>
  </div>

  <!-- TABLE -->
  <div class="tableBox">
    <table>
      <thead>
        <tr>
          <th>姓名</th>
          <th>日期</th>
          <th>時間</th>
          <th>公司</th>
          <th>狀態</th>
          <th>原因</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<!-- MODAL -->
<div id="overlay" onclick="closeModal()"></div>

<div id="modal">
  <button class="closeBtn" onclick="closeModal()">×</button>

  <h3>簽核作業</h3>

  <div class="modal-content" id="mContent"></div>

  <div class="actionBtns">
    <button id="okBtn" class="approveBtn" onclick="submit(true)">✔ 核准</button>
    <button id="noBtn" class="rejectBtn" onclick="submit(false)">✖ 退回</button>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxxFjQj7wFbAcG55GXNTdIWZ0xrQtMfKXSvW0bE7ujgTGO41mhd3gwfImDKoi5rIDdh/exec";

let code="", role="", name="";
let listCache=[];
let filter="ALL";
let currentKey="";

async function login(){
  const v=document.getElementById("code").value;

  const r=await fetch(`${API}?action=checkLogin&code=${v}`).then(r=>r.json());
  if(!r) return alert("登入失敗");

  code=v;
  role=r.role;
  name=r.approverName;

  document.getElementById("loginBox").style.display="none";
  document.getElementById("main").style.display="block";

  load();
}

function logout(){
  location.replace("https://script.google.com/macros/s/AKfycbxBaH8FGsqhonffJgszR2SYFUz0XpZZVzDQeEdHr_xVMQpj3NvAP1rT4ar3T5kMpmlpIA/exec");
}

/* FILTER */
function setFilter(f){
  filter=f;
  render();
}

/* LOAD DATA */
async function load(){
  const r=await fetch(`${API}?action=getLeaveData&code=${code}`).then(r=>r.json());

  listCache=r.list;

  // count
  document.getElementById("btnAll").innerText=`全部 (${r.count.ALL})`;
  document.getElementById("btn1").innerText=`未簽核 (${r.count['未簽核']})`;
  document.getElementById("btn2").innerText=`簽核中 (${r.count['簽核中']})`;
  document.getElementById("btn3").innerText=`已簽核 (${r.count['已簽核']})`;

  render();
}

/* RENDER */
function render(){
  const tb=document.getElementById("tbody");
  tb.innerHTML="";

  listCache
    .filter(x=>filter==="ALL"||x.status===filter)
    .forEach(r=>{
      const tr=document.createElement("tr");
      tr.onclick=()=>open(r);

      tr.innerHTML=`
        <td>${r.userName}</td>
        <td>${r.date}</td>
        <td>${r.time}</td>
        <td>${r.company||""}</td>
        <td><span class="badge badge-${r.status}">${r.status}</span></td>
        <td>${r.reason||""}</td>
      `;
      tb.appendChild(tr);
    });
}

/* MODAL */
function open(r){
  currentKey=r.keyId;

  document.getElementById("mContent").innerHTML=`
    姓名：${r.userName}<br>
    日期：${r.date}<br>
    時間：${r.time}<br>
    原因：${r.reason||""}
  `;

  document.getElementById("overlay").style.display="block";
  document.getElementById("modal").style.display="block";
}

function closeModal(){
  document.getElementById("overlay").style.display="none";
  document.getElementById("modal").style.display="none";
}

/* SUBMIT */
async function submit(ok){

  if(!confirm(ok?"確認核准？":"確認退回？")) return;

  const okBtn=document.getElementById("okBtn");
  const noBtn=document.getElementById("noBtn");

  okBtn.disabled=true;
  noBtn.disabled=true;

  try{
    const p=new URLSearchParams();
    p.append("action","updateLeaveApproval");
    p.append("keyId",currentKey);
    p.append("approver",name);
    p.append("status",ok?"核准":"不准");

    const res=await fetch(`${API}?${p}`).then(r=>r.json());

    alert(res.message||"完成");
    closeModal();
    load();

  }finally{
    okBtn.disabled=false;
    noBtn.disabled=false;
  }
}
</script>

</body>
</html>
