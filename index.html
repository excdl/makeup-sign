<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補打卡簽核系統</title>

<style>
body{
  margin:0;
  font-family:"Segoe UI", Arial;
  background:#f5f7fb;
}

/* LOGIN */
#loginBox{
  display:flex;
  flex-direction:column;
  max-width:380px;
  margin:80px auto;
  background:#fff;
  padding:28px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
#loginBox h2{
  text-align:center;
  margin-bottom:20px;
}
#loginBox input{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:10px;
}
#loginBox button{
  padding:12px;
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* MAIN */
#mainCard{
  display:none;
  margin:16px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  overflow:hidden;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  border-bottom:1px solid #eee;
}

.logoutBtn{
  background:#ef4444;
  color:#fff;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* FILTER */
.filters{
  display:flex;
  gap:10px;
  padding:12px;
  overflow-x:auto;
}

.filters button{
  border:none;
  padding:8px 14px;
  border-radius:999px;
  background:#eef2f7;
  cursor:pointer;
  white-space:nowrap;
}

.filters button.active{
  background:#2563eb;
  color:#fff;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#f1f5f9;
  padding:10px;
  font-size:13px;
  text-align:center;
  position:sticky;
  top:0;
}

td{
  padding:10px;
  text-align:center;
  border-bottom:1px solid #eee;
  font-size:14px;
}

tr:hover{
  background:#f8fafc;
  cursor:pointer;
}

/* BADGE */
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}

.badge-未簽核{ background:#fee2e2; color:#b91c1c; }
.badge-簽核中{ background:#fef3c7; color:#b45309; }
.badge-已簽核{ background:#dcfce7; color:#166534; }

/* MODAL */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
}

#modal{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:14px;
  padding:20px;
}

.actionBtns{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.actionBtns button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}

.approve{ background:#16a34a; }
.reject{ background:#dc2626; }

/* loading */
.loading{
  text-align:center;
  padding:20px;
  color:#666;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>補打卡簽核系統</h2>
  <input id="loginCode" placeholder="請輸入代碼">
  <button onclick="login()">登入</button>
</div>

<!-- MAIN -->
<div id="mainCard">
  <div class="header">
    <div>補打卡簽核系統</div>
    <button class="logoutBtn" onclick="logout()">登出</button>
  </div>

  <div class="filters">
    <button id="btnAll" onclick="setStatus('ALL')">全部</button>
    <button id="btnPending" onclick="setStatus('未簽核')">未簽核</button>
    <button id="btnProcessing" onclick="setStatus('簽核中')">簽核中</button>
    <button id="btnDone" onclick="setStatus('已簽核')">已簽核</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>姓名</th>
        <th>日期</th>
        <th>時間</th>
        <th>公司</th>
        <th>狀態</th>
        <th>補打卡</th>
        <th>原因</th>
        <th>簽核</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="8" class="loading">請先登入</td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL -->
<div id="overlay"></div>

<div id="modal">
  <h3>簽核</h3>
  <div>姓名：<span id="mName"></span></div>
  <div>日期：<span id="mDate"></span></div>
  <div>時間：<span id="mTime"></span></div>
  <div>原因：<span id="mReason"></span></div>

  <div class="actionBtns">
    <button class="approve" onclick="submit(true)">核准</button>
    <button class="reject" onclick="submit(false)">駁回</button>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxFjQj7wFbAcG55GXNTdIWZ0xrQtMfKXSvW0bE7ujgTGO41mhd3gwfImDKoi5rIDdh/exec";

let loginCode = "";
let userRole = "";
let approverName = "";
let statusFilter = "未簽核";
let cache = [];
let currentKey = null;

const $ = id => document.getElementById(id);

async function login(){
  const code = $("loginCode").value.trim();
  if(!code) return alert("請輸入代碼");

  const res = await fetch(`${WEB_APP_URL}?action=checkLogin&code=${code}`).then(r=>r.json());

  if(!res) return alert("登入失敗");

  loginCode = code;
  userRole = res.role;
  approverName = res.approverName;

  $("loginBox").style.display = "none";
  $("mainCard").style.display = "block";

  loadData();
}

function logout(){
  window.location.reload();
}

/* LOAD DATA */
async function loadData(){
  $("tbody").innerHTML = `<tr><td colspan="8">載入中...</td></tr>`;

  const res = await fetch(`${WEB_APP_URL}?action=getLeaveData&code=${loginCode}`).then(r=>r.json());

  cache = res.list || [];

  updateCount(res.count);
  render();
}

function updateCount(c){
  $("btnAll").textContent = `全部 (${c.ALL})`;
  $("btnPending").textContent = `未簽核 (${c["未簽核"]})`;
  $("btnProcessing").textContent = `簽核中 (${c["簽核中"]})`;
  $("btnDone").textContent = `已簽核 (${c["已簽核"]})`;
}

/* RENDER */
function render(){
  let html = "";

  for(const r of cache){
    if(statusFilter !== "ALL" && r.status !== statusFilter) continue;

    const can = canApprove(r);

    html += `
      <tr ${can ? `onclick="openModal('${r.keyId}')"` : ""}>
        <td>${r.userName}</td>
        <td>${r.date}</td>
        <td>${r.time}</td>
        <td>${r.company}</td>
        <td><span class="badge badge-${r.status}">${r.status}</span></td>
        <td>${r.補打卡 || ""}</td>
        <td>${r.reason || ""}</td>
        <td>${can ? "待審核" : "-"}</td>
      </tr>
    `;
  }

  $("tbody").innerHTML = html || `<tr><td colspan="8">無資料</td></tr>`;
}

/* FILTER */
function setStatus(s){
  statusFilter = s;

  document.querySelectorAll(".filters button")
    .forEach(b=>b.classList.remove("active"));

  if(s==="ALL") $("btnAll").classList.add("active");
  if(s==="未簽核") $("btnPending").classList.add("active");
  if(s==="簽核中") $("btnProcessing").classList.add("active");
  if(s==="已簽核") $("btnDone").classList.add("active");

  render();
}

/* PERMISSION */
function canApprove(r){
  return (userRole==="督導" && r.status==="未簽核") ||
         (userRole==="總督導" && r.status==="簽核中");
}

/* MODAL */
function openModal(key){
  currentKey = key;

  const r = cache.find(x=>x.keyId===key);

  $("mName").textContent = r.userName;
  $("mDate").textContent = r.date;
  $("mTime").textContent = r.time;
  $("mReason").textContent = r.reason || "";

  $("overlay").style.display="block";
  $("modal").style.display="block";
}

function submit(ok){
  const params = new URLSearchParams({
    action:"updateLeaveApproval",
    keyId:currentKey,
    approver:approverName,
    status:ok ? "核准" : "不准"
  });

  fetch(`${WEB_APP_URL}?${params}`)
    .then(r=>r.json())
    .then(res=>{
      alert(res.message || "完成");
      closeModal();
      loadData();
    });
}

function closeModal(){
  $("overlay").style.display="none";
  $("modal").style.display="none";
}

$("overlay").onclick = closeModal;
</script>

</body>
</html>
