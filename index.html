<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補打卡簽核系統</title>

<style>
body{
  font-family: "Noto Sans TC", Arial;
  margin:0;
  background:#f3f5f7;
  color:#333;
}

/* LOGIN */
#loginBox{
  display:flex;
  flex-direction:column;
  max-width:380px;
  margin:90px auto;
  background:#fff;
  padding:28px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}
#loginBox h2{
  text-align:center;
  margin-bottom:18px;
}
#loginBox input{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
}
#loginBox button{
  margin-top:12px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#1f6feb;
  color:#fff;
  font-weight:bold;
}

/* MAIN */
#mainCard{
  display:none;
  margin:18px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  overflow:hidden;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-bottom:1px solid #eee;
  font-weight:600;
  font-size:18px;
}

/* X BUTTON */
.closeX{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid #ddd;
  background:#fff;
  cursor:pointer;
  font-size:18px;
  line-height:30px;
}

/* FILTER */
.filters{
  display:flex;
  gap:8px;
  padding:10px;
  overflow-x:auto;
  background:#fafafa;
}
.filters button{
  border:0;
  padding:8px 14px;
  border-radius:999px;
  background:#e9ecef;
  cursor:pointer;
  white-space:nowrap;
}
.filters button.active{
  background:#1f6feb;
  color:#fff;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th{
  background:#f6f8fa;
  text-align:center;
  padding:10px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
}
td{
  text-align:center;
  padding:10px;
  border-bottom:1px solid #f0f0f0;
}
tr:hover{
  background:#f8fbff;
  cursor:pointer;
}

/* BADGE */
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}
.badge-未簽核{ background:#fff1f0; color:#cf1322; }
.badge-簽核中{ background:#fff7e6; color:#d46b08; }
.badge-已簽核{ background:#f6ffed; color:#389e0d; }

/* MODAL */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
}
#modal{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:12px;
  padding:18px;
}
.actionBtns{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.actionBtns button{
  flex:1;
  padding:10px;
  border:0;
  border-radius:8px;
  color:#fff;
}
.approveBtn{ background:#389e0d; }
.rejectBtn{ background:#cf1322; }

.loading{
  text-align:center;
  padding:14px;
  color:#888;
}
</style>
</head>

<body>

<div id="loginBox">
  <h2>補打卡簽核系統</h2>
  <input id="loginCode" placeholder="請輸入代碼">
  <button onclick="login()">登入</button>
</div>

<div id="mainCard">

  <div class="header">
    補打卡簽核系統
    <button class="closeX" onclick="logout()">×</button>
  </div>

  <div class="filters">
    <button id="btnAll" onclick="setStatus('ALL')">全部</button>
    <button id="btnPending" onclick="setStatus('未簽核')">未簽核</button>
    <button id="btnProcessing" onclick="setStatus('簽核中')">簽核中</button>
    <button id="btnDone" onclick="setStatus('已簽核')">已簽核</button>
  </div>

  <div id="loading" class="loading">載入中...</div>

  <table>
    <thead>
      <tr>
        <th>姓名</th><th>日期</th><th>時間</th>
        <th>公司</th><th>狀態</th><th>補打卡</th><th>原因</th><th>簽核</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

</div>

<div id="overlay"></div>

<div id="modal">
  <h3>簽核</h3>
  <div>姓名：<span id="modalName"></span></div>
  <div>補打卡：<span id="modalType"></span></div>
  <div>日期：<span id="modalDate"></span></div>
  <div>時間：<span id="modalTime"></span></div>
  <div>原因：<span id="modalReason"></span></div>

  <div class="actionBtns">
    <button class="approveBtn" onclick="submit(true)">核准</button>
    <button class="rejectBtn" onclick="submit(false)">駁回</button>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxFjQj7wFbAcG55GXNTdIWZ0xrQtMfKXSvW0bE7ujgTGO41mhd3gwfImDKoi5rIDdh/exec";

let loginCode="", userRole="", approverName="";
let statusFilter="未簽核";
let currentKey=null, currentLevel=null;

let abortCtrl=null;

/* cache DOM */
const tbody=document.getElementById("tbody");
const loading=document.getElementById("loading");
const btns={
  ALL:document.getElementById("btnAll"),
  未簽核:document.getElementById("btnPending"),
  簽核中:document.getElementById("btnProcessing"),
  已簽核:document.getElementById("btnDone"),
};

function login(){
  const code=document.getElementById("loginCode").value.trim();
  if(!code) return alert("請輸入代碼");

  fetch(`${WEB_APP_URL}?action=checkLogin&code=${code}`)
  .then(r=>r.json())
  .then(res=>{
    loginCode=code;
    userRole=res.role;
    approverName=res.approverName;

    document.getElementById("loginBox").style.display="none";
    document.getElementById("mainCard").style.display="block";

    setStatus("未簽核");
  });
}

function logout(){
  window.location.replace("https://script.google.com/macros/s/AKfycbxBaH8FGsqhonffJgszR2SYFUz0XpZZVzDQeEdHr_xVMQpj3NvAP1rT4ar3T5kMpmlpIA/exec");
}

function setStatus(s){
  statusFilter=s;
  Object.values(btns).forEach(b=>b.classList.remove("active"));
  btns[s]?.classList.add("active");
  loadData();
}

async function loadData(){
  if(abortCtrl) abortCtrl.abort();
  abortCtrl=new AbortController();

  loading.style.display="block";
  tbody.innerHTML="";

  const res=await fetch(
    `${WEB_APP_URL}?action=getLeaveData&code=${loginCode}`,
    {signal:abortCtrl.signal}
  ).then(r=>r.json());

  btns.ALL.textContent=`全部 (${res.count.ALL})`;
  btns.未簽核.textContent=`未簽核 (${res.count['未簽核']})`;
  btns.簽核中.textContent=`簽核中 (${res.count['簽核中']})`;
  btns.已簽核.textContent=`已簽核 (${res.count['已簽核']})`;

  render(res.list);
  loading.style.display="none";
}

function render(list){
  let html="";

  for(const r of list){
    if(statusFilter!=="ALL" && r.status!==statusFilter) continue;

    const badge=`<span class="badge badge-${r.status}">${r.status}</span>`;

    html+=`
      <tr ${canApprove(r)?`onclick='openModal(${JSON.stringify(r)})'`:''}>
        <td>${r.userName}</td>
        <td>${r.date}</td>
        <td>${r.time}</td>
        <td>${r.company}</td>
        <td>${r.punchStatus}</td>
        <td>${r.補打卡||""}</td>
        <td>${r.reason||""}</td>
        <td>${badge}</td>
      </tr>
    `;
  }

  tbody.innerHTML=html;
}

function canApprove(r){
  return (userRole==="督導" && r.status==="未簽核") ||
         (userRole==="總督導" && r.status==="簽核中");
}

function openModal(r){
  currentKey=r.keyId;
  currentLevel=(r.status==="簽核中")?2:1;

  modalName.textContent=r.userName;
  modalType.textContent=r.補打卡;
  modalDate.textContent=r.date;
  modalTime.textContent=r.time;
  modalReason.textContent=r.reason||"";

  overlay.style.display=modal.style.display="block";
}

function submit(ok){
  const params=new URLSearchParams();
  params.append("action","updateLeaveApproval");
  params.append("keyId",currentKey);
  params.append("level",currentLevel);
  params.append("approver",approverName);
  params.append("status",ok?"核准":"不准");

  fetch(`${WEB_APP_URL}?${params}`)
  .then(r=>r.json())
  .then(res=>{
    alert(res.message||"完成");
    closeModal();
    loadData();
  });
}

function closeModal(){
  overlay.style.display=modal.style.display="none";
}
</script>

</body>
</html>
