<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補打卡簽核系統</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f4f6f8;
}

/* LOGIN */
#loginBox{
  display:flex;
  flex-direction:column;
  max-width:380px;
  margin:90px auto;
  background:#fff;
  padding:28px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.12);
}
#loginBox h2{ text-align:center; margin-bottom:20px;}
#loginBox input{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
}
#loginBox button{
  margin-top:12px;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#1976d2;
  color:#fff;
}

/* HEADER (104風格) */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.title{
  font-size:18px;
  font-weight:700;
}

/* ❌ EXIT BUTTON */
.closeExit{
  width:34px;
  height:34px;
  border-radius:50%;
  border:none;
  background:#eee;
  font-size:18px;
  cursor:pointer;
}
.closeExit:hover{
  background:#ff4d4f;
  color:#fff;
}

/* FILTER */
.filters{
  display:flex;
  gap:8px;
  padding:12px 16px;
  overflow-x:auto;
}
.filters button{
  border:none;
  padding:8px 14px;
  border-radius:20px;
  background:#e9ecef;
  cursor:pointer;
  white-space:nowrap;
}
.filters button.active{
  background:#1976d2;
  color:#fff;
}

/* CARD LIST (取代 table → 104感) */
.list{
  padding:10px 14px;
}
.card{
  background:#fff;
  margin-bottom:10px;
  border-radius:10px;
  padding:12px;
  box-shadow:0 1px 6px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.2s;
}
.card:hover{
  transform:translateY(-2px);
}
.row{
  display:flex;
  justify-content:space-between;
  margin:4px 0;
}
.badge{
  padding:4px 10px;
  border-radius:12px;
  font-size:12px;
}
.未簽核{background:#fff0f0;color:#d32f2f;}
.簽核中{background:#fff7e6;color:#ff8c00;}
.已簽核{background:#e6f4ea;color:#2e7d32;}

/* MODAL */
#overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
}
#modal{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#fff;
  padding:16px;
  width:90%;
  max-width:420px;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>補打卡簽核系統</h2>
  <input id="loginCode" placeholder="請輸入代碼">
  <button onclick="login()">登入</button>
</div>

<!-- MAIN -->
<div id="main" style="display:none">

  <div class="header">
    <div class="title">補打卡簽核系統</div>
    <button class="closeExit" onclick="logout()">×</button>
  </div>

  <div class="filters">
    <button onclick="setStatus('ALL')" id="bAll">全部</button>
    <button onclick="setStatus('未簽核')" id="b1">未簽核</button>
    <button onclick="setStatus('簽核中')" id="b2">簽核中</button>
    <button onclick="setStatus('已簽核')" id="b3">已簽核</button>
  </div>

  <div class="list" id="list"></div>
</div>

<!-- MODAL -->
<div id="overlay" onclick="closeModal()"></div>

<div id="modal">
  <h3>簽核</h3>
  <div id="mContent"></div>
  <button onclick="closeModal()">關閉</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbxxFjQj7wFbAcG55GXNTdIWZ0xrQtMfKXSvW0bE7ujgTGO41mhd3gwfImDKoi5rIDdh/exec";

let code='', role='', name='';
let cacheList=[];
let filter='未簽核';

async function login(){
  const v=document.getElementById('loginCode').value;
  const r=await fetch(`${API}?action=checkLogin&code=${v}`).then(r=>r.json());
  if(!r) return alert('錯誤');

  code=v;
  role=r.role;
  name=r.approverName;

  document.getElementById('loginBox').style.display='none';
  document.getElementById('main').style.display='block';

  load();
}

function logout(){
  location.replace("https://script.google.com/macros/s/AKfycbxBaH8FGsqhonffJgszR2SYFUz0XpZZVzDQeEdHr_xVMQpj3NvAP1rT4ar3T5kMpmlpIA/exec");
}

function setStatus(s){
  filter=s;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

/* 🚀 只抓一次 */
async function load(){
  const r=await fetch(`${API}?action=getLeaveData&code=${code}`).then(r=>r.json());
  cacheList=r.list;
  render();
}

/* 🚀 前端過濾 + DOM減少 */
function render(){
  const box=document.getElementById('list');
  box.innerHTML='';
  const frag=document.createDocumentFragment();

  cacheList
    .filter(x=>filter==='ALL'||x.status===filter)
    .forEach(r=>{
      const div=document.createElement('div');
      div.className='card';
      div.onclick=()=>open(r);

      div.innerHTML=`
        <div class="row"><b>${r.userName}</b><span class="badge ${r.status}">${r.status}</span></div>
        <div class="row">${r.date} ${r.time}</div>
        <div class="row">${r.reason||''}</div>
      `;
      frag.appendChild(div);
    });

  box.appendChild(frag);
}

function open(r){
  document.getElementById('mContent').innerHTML=`
    <p>姓名：${r.userName}</p>
    <p>原因：${r.reason||''}</p>
  `;
  document.getElementById('overlay').style.display='block';
  document.getElementById('modal').style.display='block';
}

function closeModal(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('modal').style.display='none';
}
</script>

</body>
</html>
