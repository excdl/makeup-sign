<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>補打卡簽核系統</title>
<style>
:root { --primary: #0066cc; --danger: #d32f2f; --bg: #f5f7fa; }
body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg); margin:0; }
#loginBox { display:flex; flex-direction:column; max-width:360px; margin:100px auto; background:#fff; padding:40px; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
#mainCard { display:none; max-width: 1000px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
.close-circle { cursor:pointer; width:30px; height:30px; border-radius:50%; background:#eee; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#666; transition:0.2s; }
.close-circle:hover { background:#ddd; color:var(--danger); }
.filters { display:flex; gap:10px; margin-bottom: 20px; }
.filters button { padding:8px 20px; border:1px solid #ddd; border-radius:4px; background:#fff; cursor:pointer; color:#333; }
.filters button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
table { width:100%; border-collapse:collapse; }
th { background:#f8f9fa; color:#333; padding:12px; border-bottom:2px solid #ddd; font-weight:600; }
td { padding:12px; border-bottom:1px solid #eee; text-align:center; }
tr:hover { background:#f0f7ff; }
.badge { padding:4px 8px; border-radius:4px; font-size:0.9em; }
.badge-簽核中 { background:#fff3e0; color:#ef6c00; }
.badge-已簽核 { background:#e8f5e9; color:#2e7d32; }
</style>
</head>
<body>

<div id="loginBox">
  <h2 style="text-align:center;">系統登入</h2>
  <input id="loginCode" type="text" placeholder="請輸入代碼" style="padding:10px; margin:10px 0; border:1px solid #ccc;">
  <button onclick="login()" style="padding:10px; background:var(--primary); color:#fff; border:none; cursor:pointer;">登入</button>
</div>

<div id="mainCard">
  <div class="header-bar">
    <h2 style="margin:0;">補打卡簽核系統</h2>
    <div class="close-circle" onclick="exitSystem()">✕</div>
  </div>
  <div class="filters" id="filterGroup">
    <button onclick="setStatus('ALL')">全部</button>
    <button class="active" onclick="setStatus('未簽核')">未簽核</button>
    <button onclick="setStatus('簽核中')">簽核中</button>
    <button onclick="setStatus('已簽核')">已簽核</button>
  </div>
  <table>
    <thead><tr><th>姓名</th><th>日期</th><th>時間</th><th>公司位置</th><th>狀態</th><th>補打原因</th><th>操作</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="7">載入中...</td></tr></tbody>
  </table>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxxFjQj7wFbAcG55GXNTdIWZ0xrQtMfKXSvW0bE7ujgTGO41mhd3gwfImDKoi5rIDdh/exec';
let loginCode='', userRole='', statusFilter='未簽核', abortController;

async function login(){
  const code = document.getElementById('loginCode').value.trim();
  const res = await fetch(`${WEB_APP_URL}?action=checkLogin&code=${code}`).then(r=>r.json());
  if(!res) return alert('代碼無效');
  loginCode = code; userRole = res.role;
  document.getElementById('loginBox').style.display='none';
  document.getElementById('mainCard').style.display='block';
  loadData();
}

function exitSystem(){
  window.location.replace('https://script.google.com/macros/s/AKfycbxBaH8FGsqhonffJgszR2SYFUz0XpZZVzDQeEdHr_xVMQpj3NvAP1rT4ar3T5kMpmlpIA/exec');
}

function setStatus(s){
  statusFilter = s;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('active', b.textContent.includes(s)));
  loadData();
}

async function loadData(){
  if(abortController) abortController.abort();
  abortController = new AbortController();
  const tbody = document.getElementById('tbody');
  
  const res = await fetch(`${WEB_APP_URL}?action=getLeaveData&code=${loginCode}`, {signal: abortController.signal}).then(r=>r.json());
  
  const fragment = document.createDocumentFragment();
  res.list.forEach(r=>{
    if(statusFilter!=='ALL' && r.status!==statusFilter) return;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.userName}</td><td>${r.date}</td><td>${r.time}</td><td>${r.company||''}</td><td><span class="badge badge-${r.status}">${r.status}</span></td><td>${r.reason||''}</td><td>${(r.status==='未簽核'||r.status==='簽核中')?'<button>簽核</button>':''}</td>`;
    fragment.appendChild(tr);
  });
  tbody.innerHTML = '';
  tbody.appendChild(fragment);
}
</script>
</body>
</html>
